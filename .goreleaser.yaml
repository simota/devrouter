version: 2

before:
  hooks:
    - go mod tidy
    # Build frontend before Go build
    - sh -c "cd web && pnpm install && pnpm run build"

builds:
  - id: devrouter
    main: ./cmd/devrouter
    binary: devrouter
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .ShortCommit }}
      - -X main.buildDate={{ .Date }}

archives:
  - id: default
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  github:
    owner: simota
    name: devrouter
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"
