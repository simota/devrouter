name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Test and build (Go ${{ matrix.go }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ["1.20.x", "stable"]
        os: [ubuntu-latest]
        include:
          - go: stable
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      # Go embeds these assets, so they must exist before Go tests or vet.
      - name: Build frontend
        working-directory: web
        run: pnpm run build

      - name: Lint and type check
        run: make lint

      - name: Test Go with race detector
        run: go test -race ./...

      - name: Test frontend
        working-directory: web
        run: pnpm run test

      - name: Build binary
        run: make build-go
