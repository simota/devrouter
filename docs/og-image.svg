<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg-cyan" cx="0%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg-green" cx="100%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#39d353" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#39d353" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e6edf3"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="#0a0e14"/>
  <rect width="1200" height="630" fill="url(#bg-cyan)"/>
  <rect width="1200" height="630" fill="url(#bg-green)"/>

  <!-- subtle grid -->
  <g stroke="#21262d" stroke-width="1" opacity="0.6">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="510" x2="1200" y2="510"/>
  </g>

  <!-- logo -->
  <g transform="translate(80,80)">
    <path d="M4 6h28M4 18h28M4 30h14" stroke="#00e5ff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="32" cy="30" r="5" fill="#00e5ff"/>
  </g>
  <text x="140" y="115" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="32" fill="#e6edf3" letter-spacing="-0.02em">DevRouter</text>
  <text x="320" y="115" font-family="'IBM Plex Mono', monospace" font-size="16" fill="#6e7681">v0.1</text>

  <!-- main title (JP) -->
  <text x="80" y="280" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="76" fill="url(#title-grad)" letter-spacing="-0.02em">Compose のままで、</text>
  <text x="80" y="370" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="76" fill="url(#title-grad)" letter-spacing="-0.02em">衝突を消す。</text>

  <!-- EN sub -->
  <text x="80" y="430" font-family="'IBM Plex Mono', monospace" font-size="22" fill="#8b949e">Compose as-is. Conflicts gone.</text>

  <!-- bottom strip: URLs -->
  <g font-family="'IBM Plex Mono', monospace" font-size="18">
    <text x="80" y="555" fill="#39d353">https://</text>
    <text x="180" y="555" fill="#e6edf3">myrepo-web.localtest.me</text>
    <text x="80" y="585" fill="#39d353">https://</text>
    <text x="180" y="585" fill="#e6edf3">myrepo-api.localtest.me</text>
  </g>

  <!-- right ornament: stack diagram -->
  <g transform="translate(820,200)" stroke="#00e5ff" stroke-width="2" fill="none">
    <rect x="0" y="0" width="220" height="60" rx="8" stroke-opacity="0.5"/>
    <rect x="20" y="80" width="220" height="60" rx="8" stroke-opacity="0.7"/>
    <rect x="40" y="160" width="220" height="60" rx="8" stroke-opacity="1"/>
    <circle cx="280" cy="190" r="6" fill="#39d353" stroke="none"/>
  </g>

  <!-- footer -->
  <text x="80" y="610" font-family="'IBM Plex Mono', monospace" font-size="14" fill="#6e7681">github.com/simota/devrouter  ·  MIT</text>
</svg>
